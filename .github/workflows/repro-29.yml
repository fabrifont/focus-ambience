# Temporal para reproducir #29 en Windows. Se borra con la rama.
name: repro-29
on:
  push:
    branches: [workhub/repro-29]
  workflow_dispatch:
jobs:
  repro:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Placa de audio virtual
        uses: LABSN/sound-ci-helpers@v1
      - name: Bajar el .exe de la última release
        shell: pwsh
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY -p focus-windows-x86_64.exe -D C:\focus
          Rename-Item C:\focus\focus-windows-x86_64.exe focus.exe
          C:\focus\focus.exe --help | Select-Object -First 3
      - name: Herramientas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\tools | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile C:\tools\yt-dlp.exe
          choco install ffmpeg -y --no-progress | Select-Object -Last 2
          "C:\tools" | Out-File -Append $env:GITHUB_PATH
      - name: Versiones
        shell: pwsh
        run: |
          yt-dlp --version; ffmpeg -version | Select-Object -First 1; ffprobe -version | Select-Object -First 1; node --version
          Get-Command yt-dlp, ffmpeg, ffprobe, node | Format-Table Name, Source
      - name: focus add (CLI)
        shell: pwsh
        continue-on-error: true
        run: |
          C:\focus\focus.exe add "https://www.youtube.com/watch?v=jNQXAC9IVRw" --name prueba 2>&1 | ForEach-Object { "$_" }
          "exit=$LASTEXITCODE"
      - name: focus add con un audio que no es de YouTube (sin bloqueo anti-bot)
        shell: pwsh
        continue-on-error: true
        run: |
          C:\focus\focus.exe add "https://upload.wikimedia.org/wikipedia/commons/c/c8/Example.ogg" --name ejemplo 2>&1 | ForEach-Object { "$_" }
          "exit=$LASTEXITCODE"
          C:\focus\focus.exe meditacion agregar "https://upload.wikimedia.org/wikipedia/commons/c/c8/Example.ogg" 5 2>&1 | ForEach-Object { "$_" }
          "exit=$LASTEXITCODE"
      - name: Agregar a traves del daemon (como hace la TUI)
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Sleep 40
          C:\focus\focus.exe timer off 2>&1 | ForEach-Object { "$_" }
          "--- daemon.log al arrancar"; Get-Content "$env:LOCALAPPDATA\focus-ambience\daemon.log" -ErrorAction SilentlyContinue
          Get-Process focus -ErrorAction SilentlyContinue | Format-Table Id, ProcessName
          $sock = New-Object System.Net.Sockets.Socket([System.Net.Sockets.AddressFamily]::Unix, [System.Net.Sockets.SocketType]::Stream, [System.Net.Sockets.ProtocolType]::Unspecified)
          $sock.Connect((New-Object System.Net.Sockets.UnixDomainSocketEndPoint("$env:TEMP\focus-ambience.sock")))
          $ns = New-Object System.Net.Sockets.NetworkStream($sock)
          $r = New-Object System.IO.StreamReader($ns); $w = New-Object System.IO.StreamWriter($ns); $w.AutoFlush = $true
          $null = $r.ReadLine()
          $w.WriteLine('{"cmd":"add","url":"https://upload.wikimedia.org/wikipedia/commons/c/c8/Example.ogg","name":"daemon","theme":"other","visual":null,"trim":null}')
          $deadline = (Get-Date).AddSeconds(90); $last = ""
          while ((Get-Date) -lt $deadline) {
            $task = $r.ReadLineAsync()
            if (-not $task.Wait(5000)) { continue }
            $l = $task.Result; if ($null -eq $l) { break }
            if ($l -match '"event":"notice"') { "NOTICE: $l" }
            elseif ($l -match '"event":"state"') {
              $m = [regex]::Match($l, '"downloads":\[[^\]]*\]').Value
              if ($m -ne $last) { "downloads: $m"; $last = $m }
              if ($l -match '"id":"daemon"') { "listo: el sonido aparece en el estado"; break }
            }
          }
          C:\focus\focus.exe list 2>&1 | ForEach-Object { "$_" }
          "--- daemon.log"
          Get-ChildItem -Recurse $env:LOCALAPPDATA,$env:APPDATA -Filter daemon.log -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName; Get-Content $_.FullName }
      - name: Lo mismo sin node en el PATH
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'nodejs' }) -join ';'
          C:\focus\focus.exe add "https://upload.wikimedia.org/wikipedia/commons/c/c8/Example.ogg" --name ejemplo2 2>&1 | ForEach-Object { "$_" }
          "exit=$LASTEXITCODE"
      - name: yt-dlp directo (mismos argumentos)
        shell: pwsh
        continue-on-error: true
        run: |
          $node = (Get-Command node).Source
          yt-dlp --js-runtimes "node:$node" --no-playlist --newline -f "bestaudio[acodec=opus]/bestaudio/best" --ffmpeg-location ffmpeg -o "$env:TEMP\src.%(ext)s" "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1 | ForEach-Object { "$_" }
          "exit=$LASTEXITCODE"
      - name: Estado
        shell: pwsh
        if: always()
        run: |
          C:\focus\focus.exe list 2>&1 | ForEach-Object { "$_" }
          Get-ChildItem -Recurse "$env:APPDATA\focus-ambience","$env:LOCALAPPDATA\focus-ambience" -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-Content "$env:LOCALAPPDATA\focus-ambience\daemon.log" -ErrorAction SilentlyContinue
