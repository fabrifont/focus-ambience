[package]
name = "focus"
version = "0.1.1"
edition = "2024"
description = "Mezclador de ambientes para concentrarse, liviano y en la terminal"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
fastrand = "2.5.0"
ogg = "0.9.2"
opus = "0.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
uds_windows = "1.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
